name: update-geo

on:
  schedule:
    - cron: "17 3 * * *"   # раз в сутки, в 03:17 UTC (06:17 по Москве)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build slim geo files
        run: GEO_WORK="$RUNNER_TEMP/geo" python3 build_geo.py

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "latest" --notes "Урезанные geosite/geoip (ru-blocked, ru). Обновляется автоматически."
          gh release upload latest "$RUNNER_TEMP/geo/out/geosite.dat" "$RUNNER_TEMP/geo/out/geoip.dat" --clobber

      # GitHub отключает расписание в публичном репозитории после 60 дней без активности.
      # Раз в месяц меняем крошечный файл, чтобы репозиторий считался живым.
      - name: Keepalive
        run: |
          date -u +%Y-%m > .keepalive
          if [ -n "$(git status --porcelain .keepalive)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .keepalive
            git commit -m "keepalive"
            git push
          fi
